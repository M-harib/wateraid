# Render Blueprint for the GrantProof API (FastAPI). The frontend is deployed on Vercel.
# Create it in Render: New > Blueprint > this repository. Set the two secret values when prompted.
services:
  - type: web
    name: grantproof-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GG_CORS_ORIGINS
        sync: false
